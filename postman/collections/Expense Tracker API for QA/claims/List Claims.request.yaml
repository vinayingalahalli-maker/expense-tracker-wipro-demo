$kind: http-request
url: "{{baseUrl}}/claims?page=1&pageSize=20&status=draft"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    description: Page number (starts at 1)
    $type: integer
  - key: pageSize
    value: "20"
    description: Number of items per page (max 100)
    $type: integer
  - key: status
    value: draft
    description: Filter by status (draft, submitted, approved, rejected, reimbursed)
    $type: string
settings: {}
examples: ./.resources/List Claims.resources/examples
order: 3000
