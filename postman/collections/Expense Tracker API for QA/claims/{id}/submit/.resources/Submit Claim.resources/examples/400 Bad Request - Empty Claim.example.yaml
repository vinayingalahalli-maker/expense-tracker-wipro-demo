$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id/submit"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "EMPTY_CLAIM",
        "message": "A claim must contain at least one expense to be submitted. Rule R6 violated.",
        "claimId": "clm_p1q2r3s4",
        "rule": "R6"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "claimId": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 2000
