$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id/reimburse"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "INSUFFICIENT_PERMISSIONS",
        "message": "This operation requires the 'finance' role. Your current role is 'approver'.",
        "requiredRole": "finance"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requiredRole": {
            "type": "string"
          }
        }
      }
order: 3000
