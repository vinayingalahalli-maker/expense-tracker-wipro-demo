$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id/reimburse"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "INVALID_STATUS_TRANSITION",
        "message": "Cannot mark a claim as reimbursed with status 'submitted'. Only claims with status 'approved' can be marked as reimbursed. Rule R9 violated.",
        "currentStatus": "submitted",
        "rule": "R9"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "currentStatus": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 2000
