$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "FORBIDDEN",
        "message": "You cannot access a claim owned by another employee. Rule R15 violated.",
        "rule": "R15"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 2000
