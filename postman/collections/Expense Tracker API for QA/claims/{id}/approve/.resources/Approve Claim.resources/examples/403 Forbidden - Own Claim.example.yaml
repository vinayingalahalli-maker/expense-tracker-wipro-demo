$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id/approve"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "CANNOT_APPROVE_OWN_CLAIM",
        "message": "An approver cannot approve or reject their own claim. Rule R12 violated.",
        "claimId": "clm_p1q2r3s4",
        "rule": "R12"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "claimId": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 3000
