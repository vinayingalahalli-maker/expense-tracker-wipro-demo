$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id/reject"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
  body:
    type: json
    content: |-
      {
        "rejectionReason": "Missing receipts for expenses over EUR 50.00. Please attach receipts and resubmit."
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "MISSING_REJECTION_REASON",
        "message": "Rejecting a claim requires a rejection reason. Rule R10 violated.",
        "field": "rejectionReason",
        "rule": "R10"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "field": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 2000
