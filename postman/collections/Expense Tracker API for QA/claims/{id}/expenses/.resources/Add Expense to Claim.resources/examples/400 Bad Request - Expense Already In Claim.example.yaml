$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id/expenses"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
  body:
    type: json
    content: |-
      {
        "expenseId": "exp_a1b2c3d4e5"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "EXPENSE_ALREADY_IN_CLAIM",
        "message": "Expense 'exp_a1b2c3d4e5' is already part of claim 'clm_x9y8z7'. An expense can belong to at most one claim. Rule R7 violated.",
        "expenseId": "exp_a1b2c3d4e5",
        "existingClaimId": "clm_x9y8z7",
        "rule": "R7"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "expenseId": {
            "type": "string"
          },
          "existingClaimId": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 2000
