$kind: http-example
request:
  url: "{{baseUrl}}/claims/:id/expenses/:expenseId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
    - key: expenseId
      value: exp_a1b2c3d4e5
      description: Expense ID
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "CLAIM_LOCKED",
        "message": "Expenses cannot be removed from a claim with status 'submitted'. Rule R11 violated.",
        "claimStatus": "submitted",
        "rule": "R11"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "claimStatus": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 2000
