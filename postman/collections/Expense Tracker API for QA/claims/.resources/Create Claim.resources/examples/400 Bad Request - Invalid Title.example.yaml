$kind: http-example
request:
  url: "{{baseUrl}}/claims"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "title": "October 2026 Business Travel Expenses",
        "expenseIds": []
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "VALIDATION_ERROR",
        "message": "Claim title must be between 1 and 100 characters.",
        "field": "title",
        "constraint": "length"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "field": {
            "type": "string"
          },
          "constraint": {
            "type": "string"
          }
        }
      }
order: 2000
