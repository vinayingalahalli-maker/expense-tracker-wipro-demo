$kind: http-example
request:
  url: "{{baseUrl}}/categories/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: cat_7x9k2m4n
      description: Category ID
  body:
    type: json
    content: |-
      {
        "name": "Business Travel",
        "receiptThreshold": 75
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "VALIDATION_ERROR",
        "message": "Category name must be between 1 and 50 characters.",
        "field": "name",
        "constraint": "length"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "field": {
            "type": "string"
          },
          "constraint": {
            "type": "string"
          }
        }
      }
order: 2000
