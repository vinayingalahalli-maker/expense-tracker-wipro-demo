$kind: http-example
request:
  url: "{{baseUrl}}/categories/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: cat_7x9k2m4n
      description: Category ID
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "CATEGORY_NOT_FOUND",
        "message": "Category with ID 'cat_invalid' does not exist.",
        "categoryId": "cat_invalid"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "categoryId": {
            "type": "string"
          }
        }
      }
order: 2000
