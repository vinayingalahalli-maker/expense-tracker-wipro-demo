$kind: http-example
request:
  url: "{{baseUrl}}/categories/:id/retire"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: cat_7x9k2m4n
      description: Category ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "cat_7x9k2m4n",
        "name": "Travel",
        "receiptThreshold": 50,
        "active": false
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "receiptThreshold": {
            "type": "integer"
          },
          "active": {
            "type": "boolean"
          }
        }
      }
order: 1000
