$kind: http-example
request:
  url: "{{baseUrl}}/categories"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Travel",
        "receiptThreshold": 50,
        "active": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "cat_7x9k2m4n",
        "name": "Travel",
        "receiptThreshold": 50,
        "active": true
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "receiptThreshold": {
            "type": "integer"
          },
          "active": {
            "type": "boolean"
          }
        }
      }
order: 1000
