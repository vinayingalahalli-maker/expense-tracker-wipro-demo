$kind: http-example
request:
  url: "{{baseUrl}}/categories"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Travel",
        "receiptThreshold": 50,
        "active": true
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "INSUFFICIENT_PERMISSIONS",
        "message": "This operation requires the 'finance' role. Your current role is 'employee'.",
        "requiredRole": "finance"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requiredRole": {
            "type": "string"
          }
        }
      }
order: 3000
