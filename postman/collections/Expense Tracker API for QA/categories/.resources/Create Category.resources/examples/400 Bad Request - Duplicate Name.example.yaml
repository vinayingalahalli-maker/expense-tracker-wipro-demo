$kind: http-example
request:
  url: "{{baseUrl}}/categories"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Travel",
        "receiptThreshold": 50,
        "active": true
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "DUPLICATE_CATEGORY_NAME",
        "message": "A category with the name 'Travel' already exists. Category names must be unique.",
        "field": "name"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "field": {
            "type": "string"
          }
        }
      }
order: 2000
