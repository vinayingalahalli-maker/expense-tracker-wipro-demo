$kind: http-example
request:
  url: "{{baseUrl}}/expenses/:id"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: exp_a1b2c3d4e5
      description: Expense ID
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "EXPENSE_LOCKED",
        "message": "Expense is part of a claim with status 'approved'. Expenses in submitted, approved, or reimbursed claims cannot be deleted. Rule R11 violated.",
        "claimId": "clm_p1q2r3s4",
        "claimStatus": "approved",
        "rule": "R11"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "claimId": {
            "type": "string"
          },
          "claimStatus": {
            "type": "string"
          },
          "rule": {
            "type": "string"
          }
        }
      }
order: 2000
