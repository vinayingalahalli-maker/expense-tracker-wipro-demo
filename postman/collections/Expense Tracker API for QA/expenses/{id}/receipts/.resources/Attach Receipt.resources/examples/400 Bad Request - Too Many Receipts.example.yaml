$kind: http-example
request:
  url: "{{baseUrl}}/expenses/:id/receipts"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: exp_a1b2c3d4e5
      description: Expense ID
  body:
    type: json
    content: |-
      {
        "receiptUrl": "https://storage.example.com/receipts/train-ticket-oct15.pdf",
        "fileName": "train-ticket-oct15.pdf",
        "contentType": "application/pdf",
        "sizeBytes": 245678
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "MAX_RECEIPTS_EXCEEDED",
        "message": "An expense can have a maximum of 10 receipts. This expense already has 10 receipts.",
        "currentReceiptCount": 10,
        "maxReceiptCount": 10
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "currentReceiptCount": {
            "type": "integer"
          },
          "maxReceiptCount": {
            "type": "integer"
          }
        }
      }
order: 2000
