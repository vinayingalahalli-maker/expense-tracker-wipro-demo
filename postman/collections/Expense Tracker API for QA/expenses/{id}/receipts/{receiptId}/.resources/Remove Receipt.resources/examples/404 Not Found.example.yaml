$kind: http-example
request:
  url: "{{baseUrl}}/expenses/:id/receipts/:receiptId"
  method: DELETE
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: exp_a1b2c3d4e5
      description: Expense ID
    - key: receiptId
      value: rcpt_x1y2z3
      description: Receipt ID
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "RECEIPT_NOT_FOUND",
        "message": "Receipt with ID 'rcpt_invalid' does not exist on this expense.",
        "receiptId": "rcpt_invalid"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "receiptId": {
            "type": "string"
          }
        }
      }
order: 2000
