$kind: http-request
name: Create Expense
method: POST
url: "{{baseUrl}}/expenses"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Response has id field', function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('id');
      });
    language: text/javascript
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 125.50,
      "currency": "EUR",
      "amountEur": 125.50,
      "dateIncurred": "2026-10-15",
      "categoryId": "cat_7x9k2m4n",
      "description": "Train ticket from Berlin to Munich",
      "paymentMethod": "personal",
      "clientReference": "PROJECT-2026-Q4"
    }
examples: ./.resources/Create Expense.resources/examples
