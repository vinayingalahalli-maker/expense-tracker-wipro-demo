$kind: http-request
name: Update Expense
method: PUT
url: "{{baseUrl}}/expenses/:id"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 4000
pathVariables:
  - key: id
    value: exp_a1b2c3d4e5
    description: Expense ID
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": 135.00,
      "currency": "EUR",
      "amountEur": 135.00,
      "dateIncurred": "2026-10-15",
      "categoryId": "cat_7x9k2m4n",
      "description": "Train ticket from Berlin to Munich (updated fare)",
      "paymentMethod": "personal",
      "clientReference": "PROJECT-2026-Q4"
    }
examples: ./.resources/Update Expense.resources/examples
