$kind: http-example
name: 403 Forbidden - Not Owner
order: 2000
request:
  method: GET
  url: "{{baseUrl}}/expenses/exp_a1b2c3d4e5"
  pathVariables:
    - key: id
      value: exp_a1b2c3d4e5
      description: Expense ID
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "FORBIDDEN",
        "message": "You cannot access an expense owned by another employee. Rule R15 violated.",
        "rule": "R15"
      }
