$kind: http-example
name: 400 Bad Request - Too Many Receipts
order: 2000
request:
  method: POST
  url: "{{baseUrl}}/expenses/exp_a1b2c3d4e5/receipts"
  headers:
    Content-Type: application/json
  pathVariables:
    - key: id
      value: exp_a1b2c3d4e5
      description: Expense ID
  body:
    type: json
    content: |-
      {
        "receiptUrl": "https://storage.example.com/receipts/train-ticket-oct15.pdf",
        "fileName": "train-ticket-oct15.pdf",
        "contentType": "application/pdf",
        "sizeBytes": 245678
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "MAX_RECEIPTS_EXCEEDED",
        "message": "An expense can have a maximum of 10 receipts. This expense already has 10 receipts.",
        "currentReceiptCount": 10,
        "maxReceiptCount": 10
      }
