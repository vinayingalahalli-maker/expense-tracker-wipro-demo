$kind: http-request
name: Remove Expense from Claim
method: DELETE
url: "{{baseUrl}}/claims/:id/expenses/:expenseId"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 6000
pathVariables:
  - key: id
    value: clm_p1q2r3s4
    description: Claim ID
  - key: expenseId
    value: exp_a1b2c3d4e5
    description: Expense ID
examples: ./.resources/Remove Expense from Claim.resources/examples
