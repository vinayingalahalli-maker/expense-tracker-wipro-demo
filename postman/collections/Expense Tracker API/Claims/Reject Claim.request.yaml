$kind: http-request
name: Reject Claim
method: POST
url: "{{baseUrl}}/claims/:id/reject"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
order: 9000
pathVariables:
  - key: id
    value: clm_p1q2r3s4
    description: Claim ID
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rejectionReason": "Missing receipts for expenses over EUR 50.00. Please attach receipts and resubmit."
    }
examples: ./.resources/Reject Claim.resources/examples
