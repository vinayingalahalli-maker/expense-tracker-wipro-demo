$kind: http-example
name: 400 Bad Request - Invalid Status Transition
order: 2000
request:
  method: POST
  url: "{{baseUrl}}/claims/clm_p1q2r3s4/approve"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "INVALID_STATUS_TRANSITION",
        "message": "Cannot approve a claim with status 'draft'. Only claims with status 'submitted' can be approved. Rule R9 violated.",
        "currentStatus": "draft",
        "rule": "R9"
      }
