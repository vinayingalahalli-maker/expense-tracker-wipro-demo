$kind: http-example
name: 400 Bad Request - Claim Locked
order: 2000
request:
  method: DELETE
  url: "{{baseUrl}}/claims/clm_p1q2r3s4/expenses/exp_a1b2c3d4e5"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
    - key: expenseId
      value: exp_a1b2c3d4e5
      description: Expense ID
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "CLAIM_LOCKED",
        "message": "Expenses cannot be removed from a claim with status 'submitted'. Rule R11 violated.",
        "claimStatus": "submitted",
        "rule": "R11"
      }
