$kind: http-example
name: 400 Bad Request - Missing Receipt
order: 3000
request:
  method: POST
  url: "{{baseUrl}}/claims/clm_p1q2r3s4/submit"
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "MISSING_RECEIPT",
        "message": "Expense 'exp_a1b2c3d4e5' has amount EUR 125.50 which exceeds the category receipt threshold of EUR 50.00. At least one receipt is required. Rule R5 violated.",
        "expenseId": "exp_a1b2c3d4e5",
        "amountEur": 125.50,
        "receiptThreshold": 50.00,
        "rule": "R5"
      }
