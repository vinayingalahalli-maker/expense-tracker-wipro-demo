$kind: http-example
name: 400 Bad Request - Missing Rejection Reason
order: 2000
request:
  method: POST
  url: "{{baseUrl}}/claims/clm_p1q2r3s4/reject"
  headers:
    Content-Type: application/json
  pathVariables:
    - key: id
      value: clm_p1q2r3s4
      description: Claim ID
  body:
    type: json
    content: |-
      {
        "rejectionReason": "Missing receipts for expenses over EUR 50.00. Please attach receipts and resubmit."
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "MISSING_REJECTION_REASON",
        "message": "Rejecting a claim requires a rejection reason. Rule R10 violated.",
        "field": "rejectionReason",
        "rule": "R10"
      }
